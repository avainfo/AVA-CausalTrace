services:
  ebpf:
    build: .
    container_name: ebpf-dev

    privileged: true
    pid: "host"

    volumes:
      - .:/workspace
      - /sys:/sys
      - /proc:/proc

    working_dir: /workspace

    stdin_open: true
    tty: true

    command: >
      sh -c "
        bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h &&
        clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -I. -c causaltrace.bpf.c -o causaltrace.bpf.o &&
        exec /bin/bash
      "

